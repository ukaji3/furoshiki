version: "2"

run:
  timeout: 5m
  # Analyse the browser tests too; they are otherwise hidden behind the tag.
  build-tags:
    - e2e

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # Deferred cleanups and best-effort writes to diagnostics streams are
      # intentionally unchecked; everything else must be.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (io.Closer).Close
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: unexported-return
        - name: error-strings
        - name: receiver-naming
        - name: increment-decrement
        - name: unused-parameter
        - name: context-as-argument
    gosec:
      excludes:
        # G304 (file inclusion): reading the site's own files is the tool's
        # purpose; paths are confined to the site root by package resolve.
        - G304
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Test helpers legitimately ignore some errors and use fixed modes.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ukaji3/furoshiki

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
